services:
  db:
    image: postgres:15
    container_name: workflow-db
    environment:
      - POSTGRES_DB=workflow_engine
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=12022007
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: workflow-engine-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/workflow_engine
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=12022007
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
