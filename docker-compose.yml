services:
  db:
    image: postgres:15
    container_name: workflow-db
    environment:
      - POSTGRES_DB=workflow_engine
      - POSTGRES_USER=postgres
      # Senha SOMENTE de desenvolvimento local. Para trocar: crie um arquivo .env com DB_PASSWORD=...
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: workflow-engine-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/workflow_engine
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-postgres}
      # Chave SOMENTE de desenvolvimento local (nao use em producao). Para trocar: JWT_SECRET no arquivo .env
      - JWT_SECRET=${JWT_SECRET:-ZGV2LW9ubHktTkFPLVVTRS1FTS1QUk9EVUNBTy1jaGF2ZS1sb2NhbC0xMjM=}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: