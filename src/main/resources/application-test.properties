# Perfil de testes: H2 em memória (não precisa de PostgreSQL nem de Docker)
spring.datasource.url=jdbc:h2:mem:workflow_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Run on different port to avoid conflicts
server.port=9090

# JWT for tests (disabled security)
jwt.secret=Y2hhdmUtU09NRU5URS1wYXJhLXRlc3Rlcy1hdXRvbWF0aWNvcy0xMjM=
jwt.expiration=86400000

workflow.scheduler-enabled=false
workflow.database-action-enabled=true
workflow.output-dir=./target/test-output

# Disable security for integration tests
spring.security.enabled=false