spring.application.name=workflow-engine

# --- Banco de dados (sobrescreva com variáveis de ambiente) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/workflow_engine}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# O schema é controlado pelo Flyway (db/migration). O Hibernate só valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=true

# --- JWT ---
# GERE UMA CHAVE SEGURA EM PRODUÇÃO: openssl rand -base64 32
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# --- Motor de workflows ---
# Pasta onde as ações FILE e WINDOWS_NOTIFICATION gravam (sandbox: nada sai dela)
workflow.output-dir=${WORKFLOW_OUTPUT_DIR:./workflow-output}
# A ação DATABASE executa SQL (apenas 1 comando DML). Desligue se expuser a API sem autenticação.
workflow.database-action-enabled=${WORKFLOW_DATABASE_ACTION_ENABLED:true}
workflow.scheduler-enabled=true
workflow.max-steps-per-execution=500
# Cria workflows de exemplo quando o banco está vazio
workflow.seed-demo-data=${WORKFLOW_SEED_DEMO:false}

# --- Observabilidade ---
management.endpoints.web.exposure.include=health,info
server.error.include-message=always

server.port=${PORT:8080}